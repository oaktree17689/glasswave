<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Glasswave player interface preview</title><desc id="desc">Illustrated dark liquid-glass music player with album artwork, playback controls, synced lyrics, notifications, and appearance settings.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11131d"/><stop offset=".55" stop-color="#20273a"/><stop offset="1" stop-color="#101b25"/></linearGradient><linearGradient id="art" x2="1" y2="1"><stop stop-color="#f1ce9d"/><stop offset=".4" stop-color="#a66caa"/><stop offset="1" stop-color="#244b69"/></linearGradient><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity=".06"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="42"/></filter></defs>
<rect width="1200" height="680" rx="34" fill="url(#bg)"/><circle cx="155" cy="90" r="165" fill="#a15eb0" opacity=".28" filter="url(#blur)"/><circle cx="1050" cy="545" r="200" fill="#37b2d4" opacity=".25" filter="url(#blur)"/>
