<rect x="470" y="105" width="452" height="120" rx="22" fill="url(#glass)" stroke="#fff" stroke-opacity=".18"/><text x="496" y="139" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700">Synced lyrics　 · LRCLIB</text><text x="496" y="175" fill="#aeb5c7" font-family="Arial,sans-serif" font-size="17">And it feels like an old-time movie</text><text x="496" y="204" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">One more hour, baby, please</text>
